<!DOCTYPE html>
<html>
<body>

    <p>Create a variable, assign a value from an input, and display it:</p>

    <input type="text" id="miInput" placeholder="Escribe algo aquí...">
    
    <button type="button" onclick="procesarDato()">Mostrar Valor</button>
    
    <p id="demo"></p>

    <script>
        function procesarDato() {
            // 1. Declaramos la variable y le asignamos el valor del input
            var valorIngresado = document.getElementById("miInput").value;
            
            // 2. Mostramos el contenido de la variable usando innerHTML
            document.getElementById("demo").innerHTML = "El valor guardado es: " + valorIngresado;
        }
    </script>

</body>
</html>
