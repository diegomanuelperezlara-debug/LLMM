<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Exercise 6 - Random Quotes</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; max-width: 500px; }
        button { background-color: #333; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        button:hover { background-color: #555; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Random Quote Generator</h2>
        <p id="quote">"Haz de cada día tu obra maestra."</p>
        <h5 id="author">- John Wooden</h5>
        <button onclick="generateQuote()">Next Quote</button>
    </div>

    <script>
        // Array de objetos con las citas y sus autores
        const quotes = [
            { text: "“El único modo de hacer un gran trabajo es amar lo que haces.”", author: "- Steve Jobs" },
            { text: "“La vida es lo que pasa mientras estás ocupado haciendo otros planes.”", author: "- John Lennon" },
            { text: "“La mente lo es todo. Lo que piensas, en eso te conviertes.”", author: "- Buddha" },
            { text: "“No cuentes los días, haz que los días cuenten.”", author: "- Muhammad Ali" }
        ];

        function generateQuote() {
            // Genera un índice aleatorio basado en la longitud del array
            const randomIndex = Math.floor(Math.random() * quotes.length);
            
            // Cambia el contenido en el HTML
            document.getElementById("quote").innerHTML = quotes[randomIndex].text;
            document.getElementById("author").innerHTML = quotes[randomIndex].author;
        }
    </script>

</body>
</html>
