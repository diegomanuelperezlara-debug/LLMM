<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Exercise 7 - Image Slider</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #eef2f3; margin: 0; }
        .slider-container { position: relative; text-align: center; }
        img { width: 400px; height: 300px; object-fit: cover; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .btn { background-color: rgba(0,0,0,0.6); color: white; border: none; padding: 10px 15px; font-size: 18px; cursor: pointer; border-radius: 5px; margin: 10px; }
        .btn:hover { background-color: rgba(0,0,0,0.8); }
    </style>
</head>
<body>

    <h2>Image Slider Project</h2>
    
    <div class="slider-container">
        <img id="slider-img" src="coche1.jpg" alt="Slider Image"><br>
        
        <button class="btn" onclick="prevImage()">Prev</button>
        <button class="btn" onclick="nextImage()">Next</button>
    </div>

    <script>
        // Array con las rutas de las imágenes disponibles
        const images = ["coche1.jpg", "coche2.jpg", "coche3.jpg"];
        let currentIndex = 0;

        function updateImage() {
            document.getElementById("slider-img").src = images[currentIndex];
        }

        function nextImage() {
            currentIndex++;
            if (currentIndex >= images.length) {
                currentIndex = 0; // Vuelve al principio si llega al final
            }
            updateImage();
        }

        function prevImage() {
            currentIndex--;
            if (currentIndex < 0) {
                currentIndex = images.length - 1; // Va a la última si retrocede desde la primera
            }
            updateImage();
        }
    </script>

</body>
</html>
