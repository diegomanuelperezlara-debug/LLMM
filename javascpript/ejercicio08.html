<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Exercise 8 - Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #ddd; margin: 0; }
        .calculator { background-color: #333; padding: 20px; border-radius: 10px; box-shadow: 0 5px 10px rgba(0,0,0,0.3); }
        #screen { width: 100%; height: 50px; background-color: #fff; border: none; font-size: 24px; text-align: right; padding-right: 10px; box-sizing: border-box; margin-bottom: 15px; border-radius: 5px; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 20px; font-size: 18px; cursor: pointer; border: none; border-radius: 5px; background-color: #f2f2f2; }
        button:hover { background-color: #e0e0e0; }
        .operator { background-color: #ff9500; color: white; }
        .operator:hover { background-color: #e08500; }
        .clear { background-color: #af2929; color: white; }
        .clear:hover { background-color: #912020; }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="screen" readonly>
        
        <div class="buttons">
            <button class="clear" onclick="clearScreen()">C</button>
            <button onclick="appendValue('/')" class="operator">/</button>
            <button onclick="appendValue('*')" class="operator">*</button>
            <button onclick="appendValue('-')" class="operator">-</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('+')" class="operator">+</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="calculateResult()">=</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('0')">0</button>
        </div>
    </div>

    <script>
        const screen = document.getElementById("screen");

        // Añade el número u operador pulsado a la pantalla
        function appendValue(val) {
            screen.value += val;
        }

        // Limpia por completo la pantalla
        function clearScreen() {
            screen.value = "";
        }

        // Resuelve la ecuación matemática escrita en la pantalla
        function calculateResult() {
            try {
                // eval() toma la cadena de texto (ej: "7+5*2") y la calcula
                screen.value = eval(screen.value);
            } catch (error) {
                screen.value = "Error"; // En caso de escribir una sintaxis inválida
            }
        }
    </script>

</body>
</html>
