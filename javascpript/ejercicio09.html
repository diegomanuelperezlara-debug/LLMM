<!DOCTYPE html>
<html>
<head>
    <title>Exercise 9 - Temperature Converter</title>
    <script>
        // Convierte de Fahrenheit a Celsius (el del ejemplo original)
        function convierteACelsius() {
            var f = document.getElementById("tbf").value;
            var c = toCelsius(f);
            document.getElementById("tbc").value = c.toFixed(2); // .toFixed(2) limita a 2 decimales
        }

        // Convierte de Celsius a Fahrenheit (Nueva funcionalidad)
        function convierteAFahrenheit() {
            var c = document.getElementById("tbc").value;
            var f = toFahrenheit(c);
            document.getElementById("tbf").value = f.toFixed(2);
        }

        // Operación matemática F -> C
        function toCelsius(f) {
            return (5/9) * (f - 32);
        }

        // Operación matemática C -> F
        function toFahrenheit(c) {
            return (c * 9/5) + 32;
        }
    </script>
</head>
<body>

    <h2>JavaScript Functions</h2>
    <p>Introduce un valor en cualquiera de los campos y pulsa su respectivo botón para realizar la conversión:</p>

    <label for="tbf">Fahrenheit: </label>
    <input type="text" id="tbf" name="tbf">
    <button type="button" onclick="convierteACelsius()">Convertir a Celsius ➔</button>
    
    <br><br>

    <label for="tbc">Celsius: </label>
    <input type="text" id="tbc" name="tbc">
    <button type="button" onclick="convierteAFahrenheit()">Convertir a Fahrenheit ➔</button>

</body>
</html>
